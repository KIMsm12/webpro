<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스마트 올팍 파킹 — 정적 발표용 버전</title>
<style>body{font-family:sans-serif;padding:20px;} .card{padding:12px;border:1px solid #ccc;margin:10px 0;border-radius:8px;}</style>
</head>
<body>
<h2>스마트 올팍 파킹 – 정적(JSON) 기반 발표용 버전</h2>
<p>API 호출 없이 GitHub Pages에서 100% 작동하도록 만든 버전입니다.</p>

<script>
// ===== 정적 JSON (API 호출 없이 동작) =====

// 공연정보 예시 데이터
const performanceData = [
  {"title":"올림픽홀 콘서트","venue":"올림픽홀","date":"2025-12-01"},
  {"title":"KSPO DOME 아이돌 콘서트","venue":"KSPO DOME","date":"2025-12-05"}
];

// 공영주차장 예시 데이터
const parkingData = [
  {"PKLT_NM":"올림픽공원 제1주차장","LAT":37.5219,"LNG":127.1231,"TPKCT":500,"PRK_CRG":"10분당 600원"},
  {"PKLT_NM":"올림픽공원 제2주차장","LAT":37.5205,"LNG":127.1250,"TPKCT":300,"PRK_CRG":"10분당 600원"},
  {"PKLT_NM":"방이동 공영주차장","LAT":37.5180,"LNG":127.1195,"TPKCT":200,"PRK_CRG":"10분당 500원"}
];

// ===== 렌더링 =====
function render() {
    const perfDiv = document.getElementById("performances");
    performanceData.forEach(p=>{
        perfDiv.innerHTML += `<div class='card'><b>${p.title}</b><br>장소: ${p.venue}<br>날짜: ${p.date}</div>`;
    });

    const parkDiv = document.getElementById("parkings");
    parkingData.forEach(p=>{
        parkDiv.innerHTML += `<div class='card'><b>${p.PKLT_NM}</b><br>좌표: ${p.LAT}, ${p.LNG}<br>총면수: ${p.TPKCT}<br>요금: ${p.PRK_CRG}</div>`;
    });
}
window.onload = render;
</script>

<h3>🎭 공연 정보 (정적 JSON)</h3>
<div id="performances"></div>

<h3>🚗 주차장 추천 (정적 JSON)</h3>
<div id="parkings"></div>

</body>
</html>
